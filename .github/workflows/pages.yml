# Publica la versión web de WipeTime en GitHub Pages (https://kingkhaax.github.io/WipeTime/).
# La lanza el workflow «Release» justo después de publicar la release (misma versión que el instalador y el portable), o a mano desde Actions.
# Antes hay que activar Pages una vez: Settings -> Pages -> Source: "GitHub Actions".

name: Web

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist
      - id: deployment
        uses: actions/deploy-pages@v4
